version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wave_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wave_admin
      POSTGRES_PASSWORD: wave_local_dev_password
      POSTGRES_DB: wave_records_db
    ports:
      - "5432:5432"
    volumes:
      - wave_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wave_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - wave_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: wave_quarantine_s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wave_minio_admin
      MINIO_ROOT_PASSWORD: wave_minio_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wave_minio_data:/data

volumes:
  wave_pg_data:
  wave_redis_data:
  wave_minio_data:
